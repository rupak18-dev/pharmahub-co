name: Server Tests

on:
  push:
    branches: [Test]
    paths:
      - "pharmahub-server/**"
      - ".github/workflows/server-tests.yml"
  pull_request:
    branches: [Test]
    paths:
      - "pharmahub-server/**"
      - ".github/workflows/server-tests.yml"

jobs:
  test:
    name: pharmahub-server (Node 22 + MongoDB 7)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pharmahub-server
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pharmahub-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: "7"
          mongodb-port: 27017

      # invitation.test.js requires an Owner to exist in the database, but a
      # fresh CI database is empty (the dev user is only seeded by
      # src/server.js), so create one with the app's own models first.
      - name: Seed CI database
        env:
          JWT_SECRET: ci-only-throwaway-secret
          MONGO_URI: mongodb://127.0.0.1:27017/pharmahub_test
        run: |
          node --input-type=module -e "
            import mongoose from 'mongoose';
            import bcrypt from 'bcryptjs';
            await mongoose.connect(process.env.MONGO_URI);
            const { Role } = await import('./src/models/Role.js');
            const { User } = await import('./src/models/User.js');
            await Role.ensureSystemRoles();
            await User.create({
              name: 'CI Owner',
              email: 'ci-owner@pharmahub.test',
              // passwordHash is required by the User schema; nothing signs in
              // with this throwaway CI account, but it must satisfy validation.
              passwordHash: await bcrypt.hash('ci-owner-throwaway', 10),
              role: 'Owner',
              orgName: 'PharmaHub CI',
              active: true,
              status: 'active',
            });
            await mongoose.disconnect();
          "

      # env.js fails fast at import unless MONGO_URI and JWT_SECRET are set,
      # so both must be present even though these are throwaway CI values.
      - name: Run tests
        env:
          NODE_ENV: test
          JWT_SECRET: ci-only-throwaway-secret
          MONGO_URI: mongodb://127.0.0.1:27017/pharmahub_test
          MONGO_URI_TEST: mongodb://127.0.0.1:27017/pharmahub_test
        run: npm test
